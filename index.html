<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迷路チャレンジ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hero">
        <p class="eyebrow">MAZE CHALLENGE</p>
        <h1>迷路チャレンジ</h1>
        <p class="subtitle">下から上へ、青いボールをゴールまで導こう</p>
      </header>

      <section class="game-card" aria-label="迷路ゲーム">
        <div class="game-info">
          <div class="stat">
            <span class="stat-label">TIME</span>
            <strong id="timer">00:00</strong>
          </div>
          <div class="stat">
            <span class="stat-label">STEPS</span>
            <strong id="steps">0</strong>
          </div>
          <button id="new-game" class="new-game-button" type="button">新しい迷路</button>
        </div>

        <div class="maze-wrap">
          <canvas id="maze" aria-label="迷路"></canvas>
          <div id="message" class="message" role="status" aria-live="polite">
            矢印キーまたは下のボタンで移動
          </div>
          <div id="game-over" class="game-over" role="alert" aria-live="assertive">
            <strong>GAME OVER</strong>
            <span>スクロールに追いつけませんでした</span>
            <button id="retry-game" type="button">もう一度挑戦</button>
          </div>
        </div>

        <div class="controls" aria-label="移動ボタン">
          <button class="control-button up" data-direction="up" type="button" aria-label="上へ">▲</button>
          <button class="control-button left" data-direction="left" type="button" aria-label="左へ">◀</button>
          <button class="control-button down" data-direction="down" type="button" aria-label="下へ">▼</button>
          <button class="control-button right" data-direction="right" type="button" aria-label="右へ">▶</button>
        </div>
      </section>

      <p class="hint">PCでは矢印キー / WASD でも操作できます</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
